spring.application.name=investhub-api

# Banco local via investhub-api/docker-compose.yml (porta 5433 no host)
# Deve coincidir com POSTGRES_* do arquivo .env (Spring não lê .env automaticamente)
spring.datasource.url=jdbc:postgresql://localhost:5433/gerenciador_investimentos
spring.datasource.username=gerenciador_app
spring.datasource.password=gerenciador_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Brapi (cotações B3)
investhub.brapi.base-url=https://brapi.dev/api
investhub.brapi.connect-timeout-ms=3000
investhub.brapi.read-timeout-ms=5000
