spring.application.name=investhub-api

# Banco local via investhub-api/docker-compose.yml
# Credenciais e segredos vêm de variáveis de ambiente (modelo em .env.example)
spring.datasource.url=jdbc:postgresql://${INVESTHUB_DB_HOST:localhost}:${INVESTHUB_DB_PORT:5433}/${INVESTHUB_DB_NAME:gerenciador_investimentos}
spring.datasource.username=${INVESTHUB_DB_USERNAME}
spring.datasource.password=${INVESTHUB_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Brapi (cotações B3)
investhub.brapi.base-url=https://brapi.dev/api
investhub.brapi.connect-timeout-ms=3000
investhub.brapi.read-timeout-ms=5000

# JWT (HS256) — obrigatório via INVESTHUB_JWT_SECRET (valor fixo apenas em application-test.properties)
investhub.jwt.secret=${INVESTHUB_JWT_SECRET}
investhub.jwt.issuer=investhub-api
investhub.jwt.access-token-ttl=PT1H
