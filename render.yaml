# InvestHub — Render Blueprint (https://render.com/docs/blueprint-spec)
# Conecte o repositório em Dashboard → Blueprints → New Blueprint Instance.

databases:
  - name: investhub-db
    plan: free
    databaseName: investhub
    user: investhub

services:
  - type: web
    name: investhub-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: investhub-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: INVESTHUB_JWT_SECRET
        sync: false
      - key: INVESTHUB_DB_URL
        fromDatabase:
          name: investhub-db
          property: connectionString
      - key: INVESTHUB_DB_USERNAME
        fromDatabase:
          name: investhub-db
          property: user
      - key: INVESTHUB_DB_PASSWORD
        fromDatabase:
          name: investhub-db
          property: password
