name: InvestHub API CI

on:
  push:
    branches:
      - main
    paths:
      - investhub-api/**
      - .github/workflows/investhub-api-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - investhub-api/**
      - .github/workflows/investhub-api-ci.yml

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: investhub-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests and JaCoCo report
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
